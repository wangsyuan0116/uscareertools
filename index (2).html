<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviva - Storyteller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.8/mammoth.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <!-- Firebase SDK - 最新版本 -->
  <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore-compat.js"></script>
  <style>
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f0f7ff 0%, #e6f2ff 100%);
      color: #1a2847;
    }

    body.dark-theme {
      background: linear-gradient(135deg, #0f1823 0%, #1a2f4a 100%);
      color: #e6f0ff;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.08);
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.12);
      transform: translateY(-2px);
    }

    body.dark-theme .card {
      background: rgba(26, 47, 74, 0.8);
      border-color: rgba(100, 180, 255, 0.2);
    }

    .heading-lg {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.7px;
      color: #0f4c9e;
    }

    body.dark-theme .heading-lg {
      color: #64b4ff;
    }

    .heading-md {
      font-size: 20px;
      font-weight: 600;
      color: #1a2847;
    }

    body.dark-theme .heading-md {
      color: #e6f0ff;
    }

    .heading-sm {
      font-size: 14px;
      font-weight: 600;
      color: #1a2847;
    }

    body.dark-theme .heading-sm {
      color: #e6f0ff;
    }

    .text-sm {
      font-size: 13px;
      color: #666;
    }

    body.dark-theme .text-sm {
      color: #aaa;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-secondary {
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(59, 130, 246, 0.2);
    }

    body.dark-theme .btn-secondary {
      background: rgba(100, 180, 255, 0.1);
      color: #64b4ff;
      border-color: rgba(100, 180, 255, 0.3);
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(240, 247, 255, 0.95) 100%);
      border-right: 1px solid rgba(59, 130, 246, 0.15);
      padding: 28px 0;
      overflow-y: auto;
      z-index: 100;
    }

    body.dark-theme .sidebar {
      background: linear-gradient(180deg, rgba(26, 47, 74, 0.98) 0%, rgba(15, 24, 35, 0.95) 100%);
      border-color: rgba(100, 180, 255, 0.15);
    }

    .sidebar-logo {
      padding: 0 24px 28px;
      border-bottom: 1px solid rgba(59, 130, 246, 0.1);
      margin-bottom: 28px;
    }

    body.dark-theme .sidebar-logo {
      border-color: rgba(100, 180, 255, 0.1);
    }

    .sidebar-logo .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: #0f4c9e;
      letter-spacing: -0.3px;
    }

    body.dark-theme .sidebar-logo .logo-text {
      color: #64b4ff;
    }

    .sidebar-logo .logo-subtext {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sidebar-nav {
      padding: 0 12px;
    }

    .sidebar-footer {
      margin-top: 24px;
      padding: 16px 20px 4px;
      border-top: 1px solid rgba(59, 130, 246, 0.1);
      font-size: 10px;
      line-height: 1.6;
      color: #aaa;
      text-align: center;
    }

    body.dark-theme .sidebar-footer {
      border-color: rgba(100, 180, 255, 0.1);
      color: #6b7a8f;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #666;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-weight: 500;
    }

    .nav-item:hover {
      color: #3b82f6;
      background: rgba(59, 130, 246, 0.08);
    }

    .nav-item.active {
      color: #2563eb;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(100, 180, 255, 0.08) 100%);
      border-left: 3px solid #3b82f6;
      padding-left: 13px;
    }

    body.dark-theme .nav-item {
      color: #aaa;
    }

    body.dark-theme .nav-item:hover {
      color: #64b4ff;
      background: rgba(100, 180, 255, 0.1);
    }

    body.dark-theme .nav-item.active {
      color: #64b4ff;
      background: linear-gradient(135deg, rgba(100, 180, 255, 0.15) 0%, rgba(100, 180, 255, 0.08) 100%);
      border-left-color: #64b4ff;
    }

    .main-content {
      margin-left: 240px;
      min-height: 100vh;
    }

    .topbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(59, 130, 246, 0.1);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    body.dark-theme .topbar {
      background: rgba(26, 47, 74, 0.95);
      border-color: rgba(100, 180, 255, 0.1);
    }

    .topbar-left {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .topbar-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .lang-toggle {
      padding: 8px 12px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #3b82f6;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-short {
      display: none;
    }

    .lang-toggle:hover {
      background: rgba(59, 130, 246, 0.2);
    }

    .lang-toggle.active {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border-color: #2563eb;
    }

    .page-content {
      padding: 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 24, 35, 0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      padding: 36px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(59, 130, 246, 0.2);
    }

    body.dark-theme .modal-content {
      background: rgba(26, 47, 74, 0.98);
      border-color: rgba(100, 180, 255, 0.2);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1a2847;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    body.dark-theme .form-label {
      color: #e6f0ff;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.9);
      color: #1a2847;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      background: white;
    }

    body.dark-theme .form-input {
      background: rgba(30, 55, 90, 0.5);
      border-color: rgba(100, 180, 255, 0.2);
      color: #e6f0ff;
    }

    body.dark-theme .form-input:focus {
      border-color: #64b4ff;
      box-shadow: 0 0 0 4px rgba(100, 180, 255, 0.1);
      background: rgba(30, 55, 90, 0.8);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-blue {
      background: rgba(59, 130, 246, 0.15);
      color: #2563eb;
    }

    .badge-green {
      background: rgba(34, 197, 94, 0.15);
      color: #16a34a;
    }

    .badge-yellow {
      background: rgba(245, 158, 11, 0.15);
      color: #b45309;
    }

    .badge-red {
      background: rgba(239, 68, 68, 0.15);
      color: #b91c1c;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-grid-5 {
      grid-template-columns: repeat(5, 1fr);
    }

    @media (max-width: 900px) {
      .stat-grid-5 {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .stat-grid-5 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .stat-card {
      padding: 24px;
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 12px rgba(59, 130, 246, 0.06);
    }

    body.dark-theme .stat-card {
      background: rgba(26, 47, 74, 0.8);
      border-color: rgba(100, 180, 255, 0.2);
    }

    .stat-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .analysis-section {
      margin-bottom: 24px;
      padding: 18px;
      background: rgba(59, 130, 246, 0.05);
      border-radius: 10px;
      border-left: 4px solid #3b82f6;
    }

    .analysis-title {
      font-size: 14px;
      font-weight: 600;
      color: #0f4c9e;
      margin-bottom: 12px;
    }

    body.dark-theme .analysis-title {
      color: #64b4ff;
    }

    .analysis-item {
      padding: 8px 0;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
    }

    body.dark-theme .analysis-item {
      color: #ddd;
    }

    .job-card-clickable {
      cursor: pointer;
    }

    .job-card-clickable:hover {
      border-color: rgba(59, 130, 246, 0.6) !important;
    }

    .pipeline-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      text-align: center;
    }

    .pipeline-count {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .pipeline-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    body.dark-theme .pipeline-label {
      color: #aaa;
    }

    .timeline-item {
      padding: 12px;
      background: rgba(59, 130, 246, 0.05);
      border-left: 3px solid #3b82f6;
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    body.dark-theme .timeline-item {
      background: rgba(100, 180, 255, 0.05);
      border-left-color: #64b4ff;
    }

    .timeline-item.upcoming {
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.05);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 4px;
    }

    .calendar-weekday-row {
      margin-bottom: 8px;
    }

    .calendar-weekday {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      padding: 4px 0;
    }

    .calendar-cell {
      min-height: 56px;
      border-radius: 8px;
      border: 1px solid rgba(59, 130, 246, 0.1);
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: rgba(59, 130, 246, 0.02);
    }

    .calendar-cell-empty {
      border: none;
      background: transparent;
    }

    .calendar-cell-today {
      border-color: #3b82f6;
      border-width: 2px;
      background: rgba(59, 130, 246, 0.08);
    }

    body.dark-theme .calendar-cell {
      border-color: rgba(100, 180, 255, 0.15);
      background: rgba(100, 180, 255, 0.03);
    }

    body.dark-theme .calendar-cell-today {
      border-color: #64b4ff;
      background: rgba(100, 180, 255, 0.1);
    }

    .calendar-day-num {
      font-size: 11px;
      color: #999;
      font-weight: 600;
    }

    .calendar-badge {
      font-size: 10px;
      font-weight: 700;
      border-radius: 4px;
      padding: 1px 4px;
      display: inline-block;
      width: fit-content;
    }

    .calendar-badge-applied {
      background: rgba(59, 130, 246, 0.15);
      color: #2563eb;
    }

    .calendar-badge-rejected {
      background: rgba(239, 68, 68, 0.15);
      color: #b91c1c;
    }

    .calendar-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    @media (max-width: 768px) {
      .calendar-cell {
        min-height: 40px;
        padding: 2px;
      }

      .calendar-day-num {
        font-size: 10px;
      }

      .calendar-badge {
        font-size: 8px;
        padding: 0 2px;
      }

      .calendar-weekday {
        font-size: 9px;
      }
    }

    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 10px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
      opacity: 0;
      transform: translateX(40px);
      animation: toast-in 0.3s ease forwards, toast-out 0.3s ease 2.7s forwards;
    }

    .toast.toast-error {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toast-out {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(40px); }
    }

    .mobile-menu-btn {
      display: none;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: #3b82f6;
      align-items: center;
      justify-content: center;
    }

    body.dark-theme .mobile-menu-btn {
      color: #64b4ff;
      background: rgba(100, 180, 255, 0.1);
      border-color: rgba(100, 180, 255, 0.2);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 24, 35, 0.5);
      z-index: 99;
    }

    .sidebar-overlay.active {
      display: block;
    }

    @media (max-width: 768px) {
      .mobile-menu-btn {
        display: inline-flex;
      }

      .sidebar {
        width: 0;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      .sidebar.mobile-open {
        width: 240px;
        transform: translateX(0);
        box-shadow: 8px 0 24px rgba(0, 0, 0, 0.2);
      }

      .main-content {
        margin-left: 0;
      }

      .page-content {
        padding: 20px;
      }

      .topbar {
        padding: 12px 16px;
        gap: 10px;
      }

      .topbar-left {
        gap: 6px;
      }

      .lang-toggle {
        padding: 8px 10px;
        font-size: 11px;
      }

      .lang-full {
        display: none;
      }

      .lang-short {
        display: inline;
      }

      .topbar-right {
        gap: 8px;
      }

      .topbar-right .btn {
        padding: 8px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-text">Aviva</div>
      <div class="logo-subtext" id="sidebar-subtext">Interview Companion</div>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </div>

  <div class="main-content" id="main-content">
    <div class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="toggleMobileSidebar()" aria-label="Menu">☰</button>
        <button class="lang-toggle active" id="lang-en" onclick="setLanguage('en')">EN</button>
        <button class="lang-toggle" id="lang-zh" onclick="setLanguage('zh')"><span class="lang-full">中文</span><span class="lang-short">中</span></button>
      </div>
      <div class="topbar-right">
        <button class="btn btn-secondary" onclick="toggleTheme()" style="width: auto;">Dark Mode</button>
        <button class="btn btn-secondary" onclick="logout()" style="width: auto;">Logout</button>
      </div>
    </div>

    <div class="page-content">
      <div id="app"></div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentEmail = null;
    let currentLang = 'en';
    let state = {
      jobs: [],
      stories: [],
      resumeText: '',
      resumeUpdatedAt: null,
      coverLetterTemplate: '',
      theme: 'light',
    };

    // ============= 🔥 FIREBASE 配置（你的真實專案）=============
    const firebaseConfig = {
      apiKey: "AIzaSyCV_za46KCcyGEeUJmcmNLbc3a49cZDHeA",
      authDomain: "aviva-job-assistant.firebaseapp.com",
      projectId: "aviva-job-assistant",
      storageBucket: "aviva-job-assistant.firebasestorage.app",
      messagingSenderId: "124464916581",
      appId: "1:124464916581:web:02ed811d51b03c1a96be8c",
      measurementId: "G-E2BH27QEL6"
    };

    let firebaseReady = false;

    // 初始化 Firebase
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        firebaseReady = true;
        console.log('✅ Firebase 初始化成功！');
        console.log('專案 ID:', firebaseConfig.projectId);
      } else {
        console.log('⏳ Firebase SDK 載入中...');
        // 等待 Firebase 載入
        const checkFirebase = setInterval(() => {
          if (typeof firebase !== 'undefined') {
            try {
              if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
              }
              firebaseReady = true;
              console.log('✅ Firebase 初始化成功！');
              clearInterval(checkFirebase);
            } catch (e) {
              console.log('Firebase 初始化中:', e.message);
            }
          }
        }, 100);
        // 5 秒後停止檢查
        setTimeout(() => clearInterval(checkFirebase), 5000);

    function storyCategoryLabel(category) {
      const map = { 'Behavioral': 'categoryBehavioral', 'Data-Driven': 'categoryDataDriven', 'Process Improvement': 'categoryProcessImprovement' };
      return t(map[category]) || category;
    }

    // ---- Story keyword bolding ----
    // Stories support a lightweight markdown-style **bold** marker so users
    // can highlight keywords in their Situation/Action/Result text. These
    // helpers render that markup as real bold text (escaping everything
    // else first so pasted text can't break the layout).
    function escapeHtml(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderStoryText(str) {
      const escaped = escapeHtml(str || '');
      const bolded = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      return bolded.replace(/\n/g, '<br>');
    }

    function combinedStoryText(story) {
      return [story.situation, story.task, story.action, story.result]
        .map(s => (s || '').trim())
        .filter(Boolean)
        .join('\n\n');
    }

    // Wraps the current textarea selection in ** ** markers (or inserts a
    // placeholder at the cursor if nothing is selected) so users don't have
    // to type the markers by hand.
    function insertBoldMarkers(textareaId) {
      const ta = document.getElementById(textareaId);
      if (!ta) return;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const value = ta.value;

      if (start === end) {
        const placeholder = currentLang === 'zh' ? '關鍵字' : 'keyword';
        const insertion = '**' + placeholder + '**';
        ta.value = value.slice(0, start) + insertion + value.slice(end);
        ta.focus();
        ta.setSelectionRange(start + 2, start + 2 + placeholder.length);
      } else {
        const wrapped = '**' + value.slice(start, end) + '**';
        ta.value = value.slice(0, start) + wrapped + value.slice(end);
        ta.focus();
        ta.setSelectionRange(start, start + wrapped.length);
      }
    }

      const map = { 'Drafting': 'confidenceDrafting', 'Developing': 'confidenceDeveloping', 'Ready': 'confidenceReady' };
      return t(map[level]) || level;

    function renderCalendarSection() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const startWeekday = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      const appliedByDay = {};
      const rejectedByDay = {};
      state.jobs.forEach(job => {
        if (job.appliedDate) appliedByDay[job.appliedDate] = (appliedByDay[job.appliedDate] || 0) + 1;
        if (job.stage === 'Rejected' && job.rejectedDate) rejectedByDay[job.rejectedDate] = (rejectedByDay[job.rejectedDate] || 0) + 1;
      });

      const monthNames = currentLang === 'zh'
        ? ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月']
        : ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const weekdayNames = currentLang === 'zh' ? ['日', '一', '二', '三', '四', '五', '六'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      let cells = '';
      for (let i = 0; i < startWeekday; i++) {
        cells += `<div class="calendar-cell calendar-cell-empty"></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const applied = appliedByDay[dateStr] || 0;
        const rejected = rejectedByDay[dateStr] || 0;
        const isToday = dateStr === todayStr;
        cells += `
          <div class="calendar-cell ${isToday ? 'calendar-cell-today' : ''}">
            <div class="calendar-day-num">${d}</div>
            ${applied > 0 ? `<div class="calendar-badge calendar-badge-applied">+${applied}</div>` : ''}
            ${rejected > 0 ? `<div class="calendar-badge calendar-badge-rejected">-${rejected}</div>` : ''}
          </div>
        `;
      }

      return `
        <div class="card" style="padding: 24px; margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <h2 class="heading-md">${t('applicationCalendar')}</h2>
            <div style="display: flex; align-items: center; gap: 10px;">
              <button onclick="changeCalendarMonth(-1)" class="btn btn-secondary" style="padding: 6px 12px;">‹</button>
              <span style="font-size: 14px; font-weight: 600; min-width: 110px; text-align: center;">${monthNames[month]} ${year}</span>
              <button onclick="changeCalendarMonth(1)" class="btn btn-secondary" style="padding: 6px 12px;">›</button>
            </div>
          </div>
          <div class="calendar-grid calendar-weekday-row">
            ${weekdayNames.map(w => `<div class="calendar-weekday">${w}</div>`).join('')}
          </div>
          <div class="calendar-grid">
            ${cells}
          </div>
          <div style="display: flex; gap: 16px; margin-top: 16px; font-size: 12px; color: #666; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 6px;"><span class="calendar-legend-dot" style="background: #3b82f6;"></span>${t('appliedJobs')}</div>
            <div style="display: flex; align-items: center; gap: 6px;"><span class="calendar-legend-dot" style="background: #ef4444;"></span>${t('rejected')}</div>
          </div>
        </div>
      `;
    }

    function getStorageKey(email) {
      return `storyteller_${email}`;
    }

    function loadUserState(email) {
      const key = getStorageKey(email);
      
      // 先試著從 Firebase 載入
      if (typeof firebase !== 'undefined' && firebase.auth().currentUser) {
        const db = firebase.firestore();
        db.collection('users').doc(firebase.auth().currentUser.uid).get()
          .then(doc => {
            if (doc.exists && doc.data().data) {
              state = doc.data().data;
              applyTheme();
              render();
            }
          })
          .catch(e => console.error('Firebase load error:', e));
      }
      
      // 從本地 localStorage 載入（作為備份）
      const saved = localStorage.getItem(key);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          return getDefaultState();
        }
      }
      return getDefaultState();
    }

    function getDefaultState() {
      return {
        jobs: [],
        stories: [],
        resumeText: '',
        resumeUpdatedAt: null,
        coverLetterTemplate: '',
        theme: localStorage.getItem('app-theme') || 'light',
      };
    }

    function saveUserState(email) {
      const key = getStorageKey(email);
      // 同時存到本地和 Firebase
      localStorage.setItem(key, JSON.stringify(state));
      
      // 如果 Firebase 已初始化且用戶已登入，也存到 Firebase
      if (typeof firebase !== 'undefined' && firebase.auth().currentUser) {
        const db = firebase.firestore();
        db.collection('users').doc(firebase.auth().currentUser.uid).set({
          email: email,
          data: state,
          lastUpdated: new Date()
        }, { merge: true }).catch(e => console.error('Firebase save error:', e));
      }
    }

    function formatDateTime(dateString) {
      if (!dateString) return 'Never';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

      if (!email.trim()) {

    function extractKeywords(text) {
      if (!text || text.length < 20) return { found: [], count: 0, byCategory: {} };
      
      const textLower = text.toLowerCase();
      const found = new Set();
      const byCategory = {};
      
      Object.entries(skillKeywords).forEach(([category, keywords]) => {
        byCategory[category] = [];
        keywords.forEach(kw => {
          if (textLower.includes(kw)) {
            found.add(kw);
            byCategory[category].push(kw);
          }
        });
      });
      
      return { found: Array.from(found), count: found.size, byCategory };
    }

    function calculateFitScore(resumeText, jdText) {
      if (!resumeText || !jdText || resumeText.length < 50 || jdText.length < 50) return 0;
      
      const resumeKeywords = extractKeywords(resumeText);
      const jdKeywords = extractKeywords(jdText);
      
      if (jdKeywords.count === 0) return 20;
      
      const matchedKeywords = resumeKeywords.found.filter(kw => 
        jdText.toLowerCase().includes(kw)
      );
      
      const matchPercentage = (matchedKeywords.length / jdKeywords.count) * 100;
      const score = Math.round(Math.min(85, matchPercentage * 0.8));
      
      return Math.max(0, score);
    }

    function getMatchedKeywords(resumeText, jdText) {
      if (!resumeText || !jdText) return [];
      const resumeKeywords = extractKeywords(resumeText);
      const jdLower = jdText.toLowerCase();
      return resumeKeywords.found.filter(kw => jdLower.includes(kw));
    }

    function getMissingKeywords(resumeText, jdText) {
      if (!resumeText || !jdText) return [];
      const jdKeywords = extractKeywords(jdText);
      const resumeLower = resumeText.toLowerCase();
      return jdKeywords.found.filter(kw => !resumeLower.includes(kw));
    }

    function getRecommendedQuestions(jdText) {
      const jdLower = jdText.toLowerCase();
      const recommended = new Set();
      
      Object.entries(interviewQuestionsMap).forEach(([keyword, questions]) => {
        if (jdLower.includes(keyword) || 
            (keyword === 'data' && (jdLower.includes('analytics') || jdLower.includes('metric'))) ||
            (keyword === 'problem_solving' && (jdLower.includes('problem') || jdLower.includes('challenge')))) {
          questions.forEach(q => recommended.add(q));
        }
      });
      
      return Array.from(recommended).slice(0, 6);
    }

    // ---- Paste-from-job-posting parsing ----
    // Takes the raw copy-pasted text of a job posting page — LinkedIn,
    // Indeed, a company careers/ATS page, or anything else — and
    // heuristically extracts the company name, job title, location, and the
    // job description, trimming away surrounding UI chrome (Apply/Save
    // buttons, "X people clicked apply", Premium upsells, hiring-team
    // blocks, etc). Uses several independent strategies since posting
    // formats vary a lot from site to site; falls back gracefully when a
    // given site doesn't provide a strong enough signal.
    function parseLinkedInJobText(rawText) {
      const text = (rawText || '').replace(/\r\n/g, '\n');

      // ---- 1. Find where the header (title/company/location) ends and the
      // actual job description begins. ----
      const jdStartPatterns = [
        /About the job/i, /Full Job Description/i, /Job Description/i,
        /About this role/i, /About the role/i, /Position Summary/i,
        /Role Overview/i, /Job Summary/i, /What you.ll do/i, /What You Will Do/i,
        /^Description\s*$/im, /^Overview\s*$/im, /^The Role\s*$/im,
        /^Responsibilities\s*$/im,
      ];
      let jdStartIdx = -1, jdStartMarkerLen = 0;
      jdStartPatterns.forEach(re => {
        const m = re.exec(text);
        if (m && (jdStartIdx === -1 || m.index < jdStartIdx)) {
          jdStartIdx = m.index;
          jdStartMarkerLen = m[0].length;
        }
      });

      if (jdStartIdx === -1) {
        // No explicit "About the job"-style heading found. Fall back to
        // splitting at the first genuinely long line (a real sentence) —
        // job title/company/location lines are short, while the JD
        // paragraph itself reads as prose.
        const lines = text.split('\n');
        let offset = 0;
        for (const line of lines) {
          const trimmed = line.trim();
          const wordCount = trimmed ? trimmed.split(/\s+/).length : 0;
          const looksLikeProse = trimmed.length > 100 || (trimmed.length > 55 && wordCount >= 8);
          if (looksLikeProse) { jdStartIdx = offset; jdStartMarkerLen = 0; break; }
          offset += line.length + 1;
        }
      }

      const headerBlock = jdStartIdx >= 0 ? text.slice(0, jdStartIdx) : text.slice(0, Math.min(text.length, 1200));
      let jdBody = jdStartIdx >= 0 ? text.slice(jdStartIdx + jdStartMarkerLen) : text;

      const stopMarkers = [
        /Job search faster with Premium/i, /People you can reach out to/i,
        /Meet the hiring team/i, /Report this job/i, /More jobs like this/i,
        /Similar jobs/i, /People also viewed/i, /Get notified about new/i,
      ];
      let endIdx = jdBody.length;
      stopMarkers.forEach(re => {
        const idx = jdBody.search(re);
        if (idx >= 0 && idx < endIdx) endIdx = idx;
      });
      jdBody = jdBody.slice(0, endIdx).trim().replace(/\n{3,}/g, '\n\n');

      let company = '';
      let position = '';

      // ---- 2. Company/position extraction — try strongest signals first. ----

      // Strategy A: LinkedIn markdown links to /company/ and /jobs/view/.
      let m = headerBlock.match(/\[([^\]]+)\]\(https?:\/\/[^\s)]*linkedin\.com\/company\/[^\s)]*\)/i);
      if (m) company = m[1].trim();
      m = headerBlock.match(/\[([^\]]+)\]\(https?:\/\/[^\s)]*linkedin\.com\/jobs\/view\/[^\s)]*\)/i);
      if (m) position = m[1].trim();

      // Strategy B: "<Title> at <Company>" on its own line (LinkedIn's
      // "SaveSave X at Y" and similar phrasing used elsewhere).
      if (!position || !company) {
        const atMatches = [...headerBlock.matchAll(/^([A-Za-z0-9][\w ,&()/.'’\-]{2,90}?) at ([A-Za-z0-9][\w ,&()/.'’\-]{2,60})$/gim)];
        if (atMatches.length) {
          let best = atMatches[0];
          atMatches.forEach(mm => { if (mm[0].length > best[0].length) best = mm; });
          if (!position) position = best[1].trim();
          if (!company) company = best[2].trim();
        }
      }

      // Strategy C: "Company · City, ST (Type)"
      if (!company) {
        m = headerBlock.match(/^([A-Za-z0-9&.,'\-\s]+?)\s*·\s*[A-Za-z\s]+,\s*[A-Z]{2}\s*\(/m);
        if (m) company = m[1].trim();
      }

      // ---- 3. Line-based fallback: strip UI chrome, keep plausible short
      // header lines as company/position candidates. ----
      const noisePatterns = [
        /^apply( now)?$/i, /^save(save)?( this job)?$/i, /^share$/i, /^message$/i,
        /^close$/i, /^cancel$/i, /^show (more options?|all|match details)$/i,
        /^tailor my resume$/i, /^help me stand out$/i, /^job (poster|details)$/i,
        /^recruiter at /i, /^hiring manager at /i, /^\d+(st|nd|rd|th)$/i,
        /mutual connection/i, /^promoted by hirer/i, /^responses managed/i,
        /reactivate premium/i, /get ai-powered advice/i,
        /people (clicked apply|viewed|also viewed)/i,
        /^\d+\s*(minute|hour|day|week|month)s?\s*ago/i,
        /^(full-time|part-time|internship|contract|temporary|on-site|onsite|remote|hybrid)(\s+(internship|full-time|part-time|contract|temporary))?$/i,
        /^savesave\b/i, /^https?:\/\//i, /^pay:/i, /^job type:/i,
        /^\$[\d,]+/i, /\ban? (hour|year)$/i,
        /^description$/i, /^overview$/i, /^job details$/i,
        /^[A-Za-z][A-Za-z ]*,\s*[A-Z]{2}(\s*\([^)]*\))?$/, // pure "City, ST (Type)" line
        /^\s*$/,
      ];

      const seen = new Set();
      const candidateLines = [];
      headerBlock
        .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1') // unwrap markdown links to their text
        .split('\n')
        .map(l => l.trim())
        .forEach(line => {
          if (!line) return;
          if (noisePatterns.some(re => re.test(line))) return;
          if (line.length < 2 || line.length > 90) return;
          const key = line.toLowerCase();
          if (seen.has(key)) return; // drop repeats (titles often appear twice)
          seen.add(key);
          candidateLines.push(line);
        });

      const TITLE_KEYWORDS = /\b(intern|internship|engineer|developer|manager|analyst|associate|director|specialist|coordinator|lead|officer|scientist|designer|consultant|representative|assistant|executive|architect|administrator|technician|strategist|advisor|trader|banker|underwriter|actuary|paralegal|clerk|supervisor|accountant|auditor|controller|recruiter|researcher|editor|writer|producer|marketer)\b/i;

      if (!position || !company) {
        const remaining = candidateLines.filter(l =>
          l.toLowerCase() !== (company || '').toLowerCase() && l.toLowerCase() !== (position || '').toLowerCase()
        );
        const withKeyword = remaining.filter(l => TITLE_KEYWORDS.test(l));
        const withoutKeyword = remaining.filter(l => !TITLE_KEYWORDS.test(l));
        if (!position && withKeyword.length) position = withKeyword[0];
        if (!company && withoutKeyword.length) {
          // Prefer a candidate that the JD's opening also references —
          // most postings introduce themselves ("Acme Corp is looking for...").
          const jdOpeningLower = jdBody.slice(0, 400).toLowerCase();
          const selfRef = withoutKeyword.find(l => jdOpeningLower.includes(l.toLowerCase()));
          company = selfRef || withoutKeyword[0];
        }
      }

      // Strategy D: company self-reference in the JD's opening sentence —
      // works even when the header has no company line at all (common on
      // Greenhouse/Lever/Workday-style career pages).
      if (!company) {
        const opening = jdBody.slice(0, 400);
        let cm = opening.match(/^([A-Z][\w&.,'’\-\s]{1,60}?)\s+(?:is|are)\s+(?:looking for|seeking|hiring|searching for|excited to)/);
        if (!cm) cm = opening.match(/^About\s+([A-Z][\w&.,'’\-\s]{1,60}?)\s*[:\n]/i);
        if (!cm) cm = opening.match(/\bJoin\s+([A-Z][\w&.,'’\-\s]{1,60}?)\s+as\b/i);
        if (!cm) cm = opening.match(/^At\s+([A-Z][\w&.,'’\-\s]{1,60}?),\s+we\b/);
        if (cm) company = cm[1].trim();
      }

      if (!position && candidateLines.length) {
        position = candidateLines.find(l => l.toLowerCase() !== (company || '').toLowerCase()) || candidateLines[0];
      }

      // If the position line still has the company tacked onto it via a
      // separator ("Title - Company", "Title | Company", "Company - Title"),
      // strip that part out now that we know the company name.
      if (company && position && position.toLowerCase() !== company.toLowerCase()) {
        const escaped = company.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        position = position
          .replace(new RegExp('\\s*[-|@,]\\s*' + escaped + '\\s*$', 'i'), '')
          .replace(new RegExp('^' + escaped + '\\s*[-|@,]\\s*', 'i'), '')
          .trim() || position;
      }

      let location = '';
      m = text.match(/([A-Za-z .]+,\s*[A-Z]{2})\s*·/);
      if (m) location = m[1].trim();
      if (!location) {
        m = headerBlock.match(/^([A-Za-z][A-Za-z ]*,\s*[A-Z]{2})(\s*\([^)]*\))?$/m);
        if (m) location = m[1].trim();
      }

      return { company, position, jd: jdBody, location };
    }

    // ---- Word (.docx) export helpers ----
    // All three exports below (Cover Letter, Resume, Story Bank) build a real
    // .docx file in the browser using the "docx" library (window.docx),
    // rather than plain .txt.

    function triggerBlobDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const element = document.createElement('a');
      element.href = url;
      element.download = filename;
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    // Turns a block of plain text into an array of docx Paragraphs, one per line.
    function textToParagraphs(text) {
      const lines = (text || '').split(/\r?\n/);
      return lines.map(line => new docx.Paragraph({
        children: [new docx.TextRun(line)],
        spacing: { after: 120 },
      }));
    }

    // Same as textToParagraphs, but understands the story bank's **bold**
    // keyword markers and renders them as real bold runs in the .docx.
    function textToParagraphsRich(text) {
      const lines = (text || '').split(/\r?\n/);
      return lines.map(line => {
        const parts = line.split(/(\*\*.+?\*\*)/g).filter(p => p !== '');
        const runs = parts.length
          ? parts.map(part => {
              const boldMatch = part.match(/^\*\*(.+)\*\*$/);
              return boldMatch
                ? new docx.TextRun({ text: boldMatch[1], bold: true })
                : new docx.TextRun(part);
            })
          : [new docx.TextRun('')];
        return new docx.Paragraph({ children: runs, spacing: { after: 120 } });
      });
    }

    async function downloadCoverLetterAsText(jobIdx) {
      const job = state.jobs[jobIdx];
      const letter = generateCoverLetterPreview(jobIdx);

      if (!letter) {
        alert(currentLang === 'zh' ? '請先設定求職信模板' : 'Please set up cover letter template first');
        return;
      }

      const doc = new docx.Document({
        sections: [{ properties: {}, children: textToParagraphs(letter) }],
      });
      const blob = await docx.Packer.toBlob(doc);
      triggerBlobDownload(blob, job.company.replace(/\s+/g, '_') + '_CoverLetter.docx');
    }

    async function exportAllStories() {
      if (!state.stories.length) {
        showToast(t('noStoriesToExport'), 'error');
        return;
      }

      const titleText = currentLang === 'zh' ? '面試題庫' : 'Interview Question Bank';
      const children = [
        new docx.Paragraph({ text: titleText, heading: docx.HeadingLevel.TITLE, spacing: { after: 300 } }),
      ];

      state.stories.forEach((story, idx) => {
        children.push(new docx.Paragraph({
          text: `${idx + 1}. ${story.title}`,
          heading: docx.HeadingLevel.HEADING_2,
          spacing: { before: 300, after: 100 },
        }));
        children.push(new docx.Paragraph({
          children: [new docx.TextRun({
            text: `${t('category')}: ${storyCategoryLabel(story.category)}   |   ${t('confidenceLevel')}: ${storyConfidenceLabel(story.confidence)}`,
            italics: true,
            size: 20,
          })],
          spacing: { after: 60 },
        }));
        children.push(new docx.Paragraph({
          children: [new docx.TextRun({
            text: t('practicedTimes').replace('{n}', story.practiceCount),
            size: 20,
            color: '666666',
          })],
          spacing: { after: 200 },
        }));

        children.push(new docx.Paragraph({
          children: [new docx.TextRun({ text: t('combinedStory'), bold: true, italics: true, color: '6d28d9' })],
          spacing: { before: 80, after: 80 },
        }));
        children.push(...textToParagraphsRich(combinedStoryText(story)));

        children.push(new docx.Paragraph({ children: [new docx.TextRun({ text: t('situation'), bold: true })], spacing: { before: 160 } }));
        children.push(...textToParagraphsRich(story.situation || ''));

        children.push(new docx.Paragraph({ children: [new docx.TextRun({ text: t('task'), bold: true })], spacing: { before: 160 } }));
        children.push(...textToParagraphsRich(story.task || ''));

        children.push(new docx.Paragraph({ children: [new docx.TextRun({ text: t('action'), bold: true })], spacing: { before: 160 } }));
        children.push(...textToParagraphsRich(story.action || ''));

        children.push(new docx.Paragraph({ children: [new docx.TextRun({ text: t('result'), bold: true })], spacing: { before: 160 } }));
        children.push(...textToParagraphsRich(story.result || ''));

        children.push(new docx.Paragraph({
          text: '',
          spacing: { after: 300 },
          border: { bottom: { color: 'CCCCCC', space: 4, style: docx.BorderStyle.SINGLE, size: 6 } },
        }));
      });

      const doc = new docx.Document({ sections: [{ properties: {}, children }] });
      const blob = await docx.Packer.toBlob(doc);
      triggerBlobDownload(blob, 'Interview_Story_Bank.docx');
      showToast(t('exportedSuccessfully'));

    function handleResumeUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const fileName = file.name;
      const fileType = file.type;

      if (fileType === 'text/plain') {
        const reader = new FileReader();
        reader.onload = (e) => {
          state.resumeText = e.target.result;
          state.resumeUpdatedAt = new Date().toISOString();
          saveUserState(currentEmail);
          document.getElementById('resume-status').textContent = t('uploadedPrefix') + ': ' + fileName;
          document.getElementById('resume-textarea').value = state.resumeText;

          state.jobs.forEach(job => {
            job.skillMatch = calculateFitScore(state.resumeText, job.jd);
            job.score = job.skillMatch;
          });
          saveUserState(currentEmail);
          showToast(currentLang === 'zh' ? '履歷上傳成功！' : 'Resume uploaded successfully!');
          render();
        };
        reader.readAsText(file);
      } else if (fileType === 'application/pdf') {
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const pdf = await pdfjsLib.getDocument(new Uint8Array(e.target.result)).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const text = await page.getTextContent();
              fullText += text.items.map(item => item.str).join('') + '\n';
            }
            state.resumeText = fullText;
            state.resumeUpdatedAt = new Date().toISOString();
            saveUserState(currentEmail);
            document.getElementById('resume-status').textContent = t('uploadedPrefix') + ': ' + fileName;
            document.getElementById('resume-textarea').value = state.resumeText;

            state.jobs.forEach(job => {
              job.skillMatch = calculateFitScore(state.resumeText, job.jd);
              job.score = job.skillMatch;
            });
            saveUserState(currentEmail);
            showToast(currentLang === 'zh' ? '履歷上傳成功！' : 'Resume uploaded successfully!');
            render();
          } catch (err) {
            document.getElementById('resume-status').textContent = currentLang === 'zh' ? 'PDF 解析錯誤' : 'Error parsing PDF';
            showToast(currentLang === 'zh' ? 'PDF 解析錯誤' : 'Error parsing PDF', 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      } else if (fileType === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' || 
                 fileType === 'application/msword' ||
                 fileName.endsWith('.docx') || fileName.endsWith('.doc')) {
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const result = await mammoth.extractRawText({ arrayBuffer: e.target.result });
            state.resumeText = result.value;
            state.resumeUpdatedAt = new Date().toISOString();
            saveUserState(currentEmail);
            document.getElementById('resume-status').textContent = t('uploadedPrefix') + ': ' + fileName;
            document.getElementById('resume-textarea').value = state.resumeText;

            state.jobs.forEach(job => {
              job.skillMatch = calculateFitScore(state.resumeText, job.jd);
              job.score = job.skillMatch;
            });
            saveUserState(currentEmail);
            showToast(currentLang === 'zh' ? '履歷上傳成功！' : 'Resume uploaded successfully!');
            render();
          } catch (err) {
            document.getElementById('resume-status').textContent = currentLang === 'zh' ? 'Word 檔案解析錯誤' : 'Error parsing Word file';
            showToast(currentLang === 'zh' ? 'Word 檔案解析錯誤' : 'Error parsing Word file', 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      }
    }

    // 顯示訊息的輔助函數
    function showMessage(elementId, message, duration = 5000) {
      const elem = document.getElementById(elementId);
      if (elem) {
        elem.textContent = message;
        elem.style.display = 'block';
        if (duration > 0) {
          setTimeout(() => {
            elem.style.display = 'none';
          }, duration);
        }
      }
    }

    // Firebase 認證函數
    function handleFirebaseLogin() {
      const email = document.getElementById('login-email')?.value;
      const password = document.getElementById('login-password')?.value;
      const loginBtn = document.querySelector('#login-mode button');
      
      // 清除之前的訊息
      document.getElementById('login-error-message').style.display = 'none';
      document.getElementById('login-success-message').style.display = 'none';
      
      if (!email || !password) {
        showMessage('login-error-message', 'Please enter email and password');
        return;
      }

      if (!firebaseReady) {
        showMessage('login-error-message', 'Firebase is initializing, please wait...');
        return;
      }

      console.log('🔵 Attempting login:', email);
      
      // 禁用按鈕防止重複點擊
      if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.style.opacity = '0.6';
        loginBtn.textContent = 'Signing in...';
      }
      
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          console.log('✅ Login successful');
          
          // 顯示綠色成功訊息
          const successMsg = document.getElementById('login-success-message');
          if (successMsg) {
            successMsg.style.display = 'block';
          }
          
          currentEmail = userCredential.user.email;
          state = loadUserState(email);
          applyTheme();
          
          // 延遲 1 秒後進入應用（讓用戶看到成功訊息）
          setTimeout(() => {
            render();
          }, 1000);
        })
        .catch(error => {
          console.error('❌ Login failed:', error);
          let errorMsg = error.message;
          
          if (error.code === 'auth/user-not-found') {
            errorMsg = 'No account found with this email.';
          } else if (error.code === 'auth/wrong-password') {
            errorMsg = 'Incorrect password.';
          } else if (error.code === 'auth/invalid-email') {
            errorMsg = 'Invalid email format.';
          }
          
          showMessage('login-error-message', errorMsg);
          
          // 恢復按鈕狀態
          if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.style.opacity = '1';
            loginBtn.textContent = 'Sign In';
          }
        });
    }

    function handleFirebaseRegister() {
      const email = document.getElementById('register-email')?.value;
      const password = document.getElementById('register-password')?.value;
      const confirm = document.getElementById('register-confirm')?.value;
      const registerBtn = document.querySelector('#register-mode button');
      
      // 清除之前的訊息
      document.getElementById('register-error-message').style.display = 'none';
      document.getElementById('register-success-message').style.display = 'none';
      
      console.log('📝 Registration form:', {email, password: '***', confirm: '***'});
      
      if (!email || !password || !confirm) {
        showMessage('register-error-message', 'Please fill in all fields');
        return;
      }

      if (password !== confirm) {
        showMessage('register-error-message', 'Passwords do not match');
        return;
      }

      if (password.length < 6) {
        showMessage('register-error-message', 'Password must be at least 6 characters');
        return;
      }

      if (!firebaseReady) {
        showMessage('register-error-message', 'Firebase is initializing, please wait...');
        return;
      }

      console.log('🔵 Attempting registration:', email);

      // 禁用按鈕
      if (registerBtn) {
        registerBtn.disabled = true;
        registerBtn.style.opacity = '0.6';
        registerBtn.textContent = 'Creating...';
      }

      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(userCredential => {
          console.log('✅ Registration successful');
          currentEmail = userCredential.user.email;
          state = getDefaultState();
          saveUserState(email);
          
          showMessage('register-success-message', 'Registration successful! Please sign in with your new account.');
          
          // 清空表單
          document.getElementById('register-email').value = '';
          document.getElementById('register-password').value = '';
          document.getElementById('register-confirm').value = '';
          
          // 2 秒後返回登入頁面
          setTimeout(() => {
            switchToLogin();
            // 恢復按鈕
            if (registerBtn) {
              registerBtn.disabled = false;
              registerBtn.style.opacity = '1';
              registerBtn.textContent = 'Create Account';
            }
          }, 2000);
        })
        .catch(error => {
          console.error('❌ Registration failed:', error);
          let errorMsg = error.message;
          
          if (error.code === 'auth/email-already-in-use') {
            errorMsg = 'This email is already registered.';
          } else if (error.code === 'auth/invalid-email') {
            errorMsg = 'Invalid email format.';
          } else if (error.code === 'auth/weak-password') {
            errorMsg = 'Password is too weak.';
          }
          
          showMessage('register-error-message', errorMsg);
          
          // 恢復按鈕
          if (registerBtn) {
            registerBtn.disabled = false;
            registerBtn.style.opacity = '1';
            registerBtn.textContent = 'Create Account';
          }
        });
    }

    function handleForgotPassword() {
      const email = document.getElementById('forgot-email')?.value;
      const forgotBtn = document.querySelector('#forgot-mode button');
      
      // 清除之前的訊息
      document.getElementById('forgot-error-message').style.display = 'none';
      document.getElementById('forgot-success-message').style.display = 'none';
      
      console.log('🔑 Forgot password email:', email);
      
      if (!email) {
        showMessage('forgot-error-message', 'Please enter your email');
        return;
      }

      if (!firebaseReady) {
        showMessage('forgot-error-message', 'Firebase is initializing, please wait...');
        return;
      }

      console.log('🔵 Sending password reset email:', email);
      
      // 禁用按鈕
      if (forgotBtn) {
        forgotBtn.disabled = true;
        forgotBtn.style.opacity = '0.6';
        forgotBtn.textContent = 'Sending...';
      }
      
      firebase.auth().sendPasswordResetEmail(email)
        .then(() => {
          console.log('✅ Email sent');
          showMessage('forgot-success-message', 'Password reset link sent! Check your email (including spam folder).', 0);
          document.getElementById('forgot-email').value = '';
          
          // 3 秒後返回登入頁面
          setTimeout(() => {
            switchToLogin();
            // 恢復按鈕
            if (forgotBtn) {
              forgotBtn.disabled = false;
              forgotBtn.style.opacity = '1';
              forgotBtn.textContent = 'Send Reset Link';
            }
          }, 3000);
        })
        .catch(error => {
          console.error('❌ Send failed:', error);
          let errorMsg = error.message;
          
          if (error.code === 'auth/user-not-found') {
            errorMsg = 'No account found with this email.';
          } else if (error.code === 'auth/invalid-email') {
            errorMsg = 'Invalid email format.';
          }
          
          showMessage('forgot-error-message', errorMsg);
          
          // 恢復按鈕
          if (forgotBtn) {
            forgotBtn.disabled = false;
            forgotBtn.style.opacity = '1';
            forgotBtn.textContent = 'Send Reset Link';
          }
        });
    }

    function viewStoryDetail(idx) {

      document.getElementById('detail-title').textContent = story.title;
      document.getElementById('detail-practice-count').textContent = story.practiceCount;
      document.getElementById('detail-confidence-badge').innerHTML = `<span class="badge badge-yellow">${storyConfidenceLabel(story.confidence)}</span>`;
      document.getElementById('detail-progress-bar').style.width = reviewPercentage + '%';
      document.getElementById('detail-combined').innerHTML = renderStoryText(combinedStoryText(story));
      document.getElementById('detail-situation').innerHTML = renderStoryText(story.situation);
      document.getElementById('detail-task').innerHTML = renderStoryText(story.task);
      document.getElementById('detail-action').innerHTML = renderStoryText(story.action);
      document.getElementById('detail-result').innerHTML = renderStoryText(story.result);

      toggleModal('story-detail-modal');
    }

    function closeStoryDetailModal() {
      toggleModal('story-detail-modal');
      currentStoryDetailIndex = -1;
    }

    function recordPracticeFromDetail() {
      if (currentStoryDetailIndex >= 0) {
        recordPractice(currentStoryDetailIndex);
      }
    }

    function renderJobTracker() {
      const dreamCount = state.jobs.filter(j => j.isDreamCompany).length;
      const avgScore = state.jobs.length ? Math.round(state.jobs.reduce((sum, j) => sum + j.score, 0) / state.jobs.length) : 0;
      const stageCount = { 'Applied': 0, 'Phone': 0, 'On-site': 0, 'Offer': 0, 'Rejected': 0 };
      state.jobs.forEach(j => stageCount[j.stage || 'Applied']++);

      return `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
          <h1 class="heading-lg">${t('jobTracker')}</h1>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="exportJobsToExcel()" class="btn btn-secondary">${t('exportAllExcel')}</button>
            <button onclick="openLinkedInPasteModal()" class="btn btn-secondary">${t('pasteFromLinkedIn')}</button>
            <button onclick="openAddJobModal()" class="btn btn-primary">${t('addPosition')}</button>
          </div>
        </div>

        <div class="stat-grid stat-grid-5">
          <div class="stat-card">
            <div class="stat-label">${t('totalApplications')}</div>
            <div class="stat-value">${state.jobs.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">${t('dreamCompanies')}</div>
            <div class="stat-value" style="background: linear-gradient(135deg, #ec4899, #db2777); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${dreamCount}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">${t('avgFitScore')}</div>
            <div class="stat-value">${avgScore}%</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">${t('inProgress')}</div>
            <div class="stat-value" style="background: linear-gradient(135deg, #f59e0b, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${stageCount['Phone'] + stageCount['On-site']}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">${t('rejected')}</div>
            <div class="stat-value" style="background: linear-gradient(135deg, #ef4444, #b91c1c); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${stageCount['Rejected']}</div>
          </div>
        </div>

        <div class="grid gap-5" style="margin-bottom: 32px;">
          ${state.jobs.map((job, idx) => `
            <div class="card card-clickable job-card-clickable" style="padding: 24px; cursor: pointer;" onclick="viewJobDetails(${idx})">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                <div>
                  <h3 class="heading-md" style="margin-bottom: 6px;">${job.company}${job.isDreamCompany ? t('dreamSuffix') : ''}</h3>
                  <p style="color: #666; font-size: 14px; margin-bottom: 4px;">${job.position}</p>
                  <p class="text-sm">${t('appliedOn')} ${job.appliedDate}</p>
                </div>
                <div style="text-align: right;">
                  <div style="font-size: 12px; color: #999; margin-bottom: 4px;">${t('fitScoreLabel')}</div>
                  <div style="font-size: 32px; font-weight: 700; background: linear-gradient(135deg, #3b82f6, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer;">${job.score}%</div>
                </div>
              </div>

              <div style="display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: nowrap;">
                ${['Applied', 'Phone', 'On-site', 'Offer', 'Rejected'].map(stage => {
                  const isActive = job.stage === stage || (stage === 'Applied' && !job.stage);
                  const activeBg = stage === 'Rejected' ? 'linear-gradient(135deg, #ef4444, #b91c1c)' : 'linear-gradient(135deg, #3b82f6, #2563eb)';
                  const borderColor = stage === 'Rejected' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(59, 130, 246, 0.2)';
                  return `
                  <button onclick="event.stopPropagation(); updateJobStage(${idx}, '${stage}')" style="flex: 1; min-width: 0; padding: 8px 2px; border-radius: 6px; border: 1px solid ${borderColor}; background: ${isActive ? activeBg : 'rgba(255, 255, 255, 0.9)'}; color: ${isActive ? 'white' : '#1a2847'}; font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${stageLabel(stage)}</button>
                `;
                }).join('')}
              </div>

              <div style="display: flex; gap: 8px;">
                <button onclick="event.stopPropagation(); downloadCoverLetterAsText(${idx})" class="btn btn-secondary" style="flex: 1; padding: 9px; opacity: ${state.coverLetterTemplate ? '1' : '0.5'} ;">${t('downloadCL')}</button>
                <button onclick="event.stopPropagation(); deleteJob(${idx})" class="btn btn-secondary" style="flex: 1; padding: 9px;">${t('delete')}</button>
              </div>
            </div>
          `).join('')}
        </div>

        <div id="job-modal" class="modal" onclick="handleModalBackdropClick(event, 'job-modal')">
          <div class="modal-content">
            <h2 class="heading-md" id="job-modal-title" style="margin-bottom: 28px;">${t('addPosition')}</h2>
            <div class="form-group">
              <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="job-dream" style="width: 18px; height: 18px;">
                <span style="font-size: 14px; font-weight: 500;">${t('dreamCompanyCheckbox')}</span>
              </label>
            </div>
            <div class="form-group">
              <label class="form-label">${t('company')}</label>
              <input type="text" id="job-company" class="form-input" placeholder="Stripe">
            </div>
            <div class="form-group">
              <label class="form-label">${t('position')}</label>
              <input type="text" id="job-position" class="form-input" placeholder="Operations Analyst">
            </div>
            <div class="form-group">
              <label class="form-label">${t('appliedDate')}</label>
              <input type="date" id="job-date" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">${t('jobUrlOptional')}</label>
              <input type="url" id="job-url" class="form-input" placeholder="https://...">
            </div>
            <div class="form-group">
              <label class="form-label">${t('stage')}</label>
              <select id="job-stage" class="form-input">
                <option value="Applied">${t('appliedJobs')}</option>
                <option value="Phone">${t('phoneInterviews')}</option>
                <option value="On-site">${t('onsiteInterviews')}</option>
                <option value="Offer">${t('offers')}</option>
                <option value="Rejected">${t('rejected')}</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">${t('jobDescription')}</label>
              <textarea id="job-jd" class="form-input" style="resize: vertical; min-height: 120px;" placeholder="${t('pasteFullJD')}"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">${t('rejectionDateOptional')}</label>
              <input type="date" id="job-rejected-date" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">${t('rejectionNotesOptional')}</label>
              <textarea id="job-rejected-reason" class="form-input" style="resize: vertical; min-height: 70px;" placeholder="${t('rejectionNotesPlaceholder')}"></textarea>
            </div>
            <div style="display: flex; gap: 12px;">
              <button onclick="closeJobModal()" class="btn btn-secondary" style="flex: 1;">${t('cancel')}</button>
              <button onclick="saveJob()" id="job-save-btn" class="btn btn-primary" style="flex: 1;">${t('savePosition')}</button>
            </div>
          </div>
        </div>

        <div id="job-details-modal" class="modal" onclick="handleModalBackdropClick(event, 'job-details-modal')">
          <div class="modal-content">
            <div id="job-details-content"></div>
            <button onclick="toggleModal('job-details-modal')" class="btn btn-primary" style="width: 100%; padding: 12px; justify-content: center; margin-top: 24px;">${t('close')}</button>
          </div>
        </div>

        <div id="linkedin-paste-modal" class="modal" onclick="handleModalBackdropClick(event, 'linkedin-paste-modal')">
          <div class="modal-content">
            <h2 class="heading-md" style="margin-bottom: 12px;">${t('pasteFromLinkedIn')}</h2>
            <p class="text-sm" style="margin-bottom: 20px; color: #999;">${t('pasteLinkedInHint')}</p>
            <div class="form-group">
              <textarea id="linkedin-paste-text" class="form-input" style="resize: vertical; min-height: 260px; font-family: 'Courier New', monospace; font-size: 12px;" placeholder="${t('pasteLinkedInPlaceholder')}"></textarea>
            </div>
            <div style="display: flex; gap: 12px;">
              <button onclick="toggleModal('linkedin-paste-modal')" class="btn btn-secondary" style="flex: 1;">${t('cancel')}</button>
              <button onclick="parseLinkedInAndOpenForm()" class="btn btn-primary" style="flex: 1;">${t('parseAndContinue')}</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderJDAnalyzer() {
      return `
        <h1 class="heading-lg" style="margin-bottom: 32px;">${t('jdAnalysis')}</h1>
        <div class="card" style="padding: 32px; margin-bottom: 24px;">
          <div class="form-group">
            <label class="form-label">${t('company')}</label>
            <input type="text" id="jd-company" class="form-input" placeholder="Stripe">
          </div>
          <div class="form-group">
            <label class="form-label">${t('position')}</label>
            <input type="text" id="jd-position" class="form-input" placeholder="Operations Analyst">
          </div>
          <div class="form-group">
            <label class="form-label">${t('jobDescription')}</label>
            <textarea id="jd-text" class="form-input" style="resize: vertical; min-height: 200px;" placeholder="${t('pleaseEnterJD')}"></textarea>
          </div>
          <button onclick="analyzeJD()" class="btn btn-primary">${t('analyzeJDBtn')}</button>
        </div>
        <div id="jd-result" style="display: none;">
          <div class="card" style="padding: 32px;">
            <h2 class="heading-md" style="margin-bottom: 24px;">${t('analysisResults')}</h2>
            <div id="jd-content"></div>
          </div>
        </div>
      `;
    }

    function analyzeJD() {
      const jdText = document.getElementById('jd-text')?.value;
      if (!jdText) {
        alert(currentLang === 'zh' ? '請輸入職位描述' : 'Please enter job description');
        return;
      }

      const skillMatch = calculateFitScore(state.resumeText, jdText);
      const matchedKeywords = getMatchedKeywords(state.resumeText, jdText);
      const missingKeywords = getMissingKeywords(state.resumeText, jdText);
      const allJdKeywords = extractKeywords(jdText);
      const recommendedQuestions = getRecommendedQuestions(jdText);

      let html = `
        <div class="stat-grid" style="margin-bottom: 24px;">
          <div class="stat-card" style="text-align: center;">
            <div class="stat-label">${t('resumeFit')}</div>
            <div class="stat-value" style="font-size: 32px;">${skillMatch}%</div>
          </div>
          <div class="stat-card" style="text-align: center;">
            <div class="stat-label">${t('skillsMatched')}</div>
            <div class="stat-value" style="font-size: 32px; color: #22c55e;">${matchedKeywords.length}</div>
          </div>
          <div class="stat-card" style="text-align: center;">
            <div class="stat-label">${t('skillsMissing')}</div>
            <div class="stat-value" style="font-size: 32px; color: #ef4444;">${missingKeywords.length}</div>
          </div>
        </div>

        <div class="analysis-section">
          <div class="analysis-title">${t('whatYouHave')}</div>
          ${matchedKeywords.length > 0 ?
            matchedKeywords.map(k => `<div class="analysis-item"><span class="badge badge-green">${t('haveLabel')}: ${k}</span></div>`).join('') :
            `<div class="analysis-item" style="color: #999;">${t('noMatchingSkillsInResume')}</div>`
          }
        </div>

        <div class="analysis-section" style="border-left-color: #ef4444; background: rgba(239, 68, 68, 0.05);">
          <div class="analysis-title" style="color: #991b1b;">${t('whatYoureMissing')}</div>
          ${missingKeywords.length > 0 ?
            missingKeywords.map(k => `<div class="analysis-item"><span class="badge badge-red">${t('missingLabel')}: ${k}</span></div>`).join('') :
            `<div class="analysis-item" style="color: #22c55e;">${t('perfectMatchAllSkillsCovered')}</div>`
          }
        </div>

        <div class="analysis-section" style="border-left-color: #8b5cf6; background: rgba(139, 92, 246, 0.05);">
          <div class="analysis-title" style="color: #6d28d9;">${t('jdRequirements')} (${allJdKeywords.count} ${t('skillsCountSuffix')})</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            ${allJdKeywords.found.map(k => `<span class="badge badge-blue">${k}</span>`).join('')}
          </div>
        </div>

        ${recommendedQuestions.length > 0 ? `
        <div class="analysis-section" style="border-left-color: #06b6d4; background: rgba(6, 182, 212, 0.05);">
          <div class="analysis-title" style="color: #0e7490;">${t('likelyInterviewQuestions')}</div>
          <div style="font-size: 13px; line-height: 1.8;">
            ${recommendedQuestions.map((q, i) => `<div style="margin-bottom: 8px;"><strong>${i+1}.</strong> ${translateQuestion(q)}</div>`).join('')}
          </div>
        </div>
        ` : ''}
      `;

      document.getElementById('jd-content').innerHTML = html;
      document.getElementById('jd-result').style.display = 'block';
    }

    function renderResume() {
      const lastUpdated = formatDateTime(state.resumeUpdatedAt);
      
      return `
        <h1 class="heading-lg" style="margin-bottom: 32px;">${t('resume')}</h1>
        <div class="card" style="padding: 32px;">
          ${state.resumeUpdatedAt ? `<div style="padding: 12px; background: rgba(34, 197, 94, 0.1); border-radius: 8px; margin-bottom: 20px; border-left: 3px solid #22c55e; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <p class="text-sm" style="color: #16a34a; font-weight: 500; margin: 0;">${t('lastUpdated')}: ${lastUpdated}</p>
            <button onclick="downloadResume()" class="btn btn-secondary" style="padding: 8px 16px;">${t('downloadResume')}</button>
          </div>` : ''}

          <div class="form-group">
            <label class="form-label">${t('uploadResumeLabel')}</label>
            <p class="text-sm" style="margin-bottom: 12px; color: #999;">${t('uploadResumeHint')}</p>
            <label for="resume-file" class="btn btn-primary" style="display: inline-flex; margin-bottom: 12px;">${t('chooseFile')}</label>
            <input type="file" id="resume-file" accept=".txt,.pdf,.docx,.doc" style="display: none;" onchange="handleResumeUpload(event)">
            <span id="resume-status" style="margin-left: 8px; font-size: 13px; color: #666;"></span>
          </div>
          <div class="form-group" style="margin-top: 32px;">
            <label class="form-label">${t('orPasteResumeText')}</label>
            <textarea id="resume-textarea" class="form-input" style="resize: vertical; min-height: 300px;" placeholder="${t('pasteResumeTextPlaceholder')}"></textarea>
          </div>
          <div style="display: flex; gap: 12px; align-items: center;">
            <button onclick="handleResumeSave()" class="btn btn-primary">${t('saveAndUpdateScores')}</button>
            <span id="resume-saved" style="font-size: 13px; color: #22c55e; font-weight: 500;"></span>
          </div>
        </div>
      `;
    }

    function renderCoverLetter() {
      return `
        <h1 class="heading-lg" style="margin-bottom: 32px;">${t('coverLetter')}</h1>
        <div class="card" style="padding: 32px; margin-bottom: 24px;">
          <div class="form-group">
            <label class="form-label">${t('coverLetterTemplateLabel')} <span style="font-size: 11px; color: #999;">${t('coverLetterTemplateHint')}</span></label>
            <textarea id="cl-template" class="form-input" style="resize: vertical; min-height: 300px; font-family: 'Courier New', monospace;" placeholder="Dear [COMPANY] Hiring Team,

I am writing to express my strong interest in the [POSITION] role at [COMPANY]."></textarea>
          </div>
          <div style="display: flex; gap: 12px; align-items: center;">
            <button onclick="saveCoverLetterTemplate()" class="btn btn-primary">${t('saveTemplate')}</button>
            <span id="cl-saved" style="font-size: 13px; color: #22c55e; font-weight: 500;"></span>
          </div>
        </div>

        ${state.coverLetterTemplate ? `
        <div class="card" style="padding: 32px;">
          <h2 class="heading-md" style="margin-bottom: 20px;">${t('generateDownload')}</h2>
          <p class="text-sm" style="margin-bottom: 20px; color: #999;">${t('selectJobToGenerate')}</p>
          <div class="form-group">
            <select id="cl-job-select" class="form-input" onchange="updateCoverLetterPreview()">
              <option value="">${t('selectAJob')}</option>
              ${state.jobs.map((job, idx) => `<option value="${idx}">${job.company} - ${job.position}</option>`).join('')}
            </select>
          </div>

          <div id="cl-preview" style="display: none;">
            <div class="form-group">
              <label class="form-label">${t('previewLabel')}</label>
              <div style="padding: 16px; background: rgba(59, 130, 246, 0.05); border-radius: 8px; white-space: pre-wrap; font-size: 13px; font-family: 'Courier New', monospace; max-height: 300px; overflow-y: auto; border-left: 3px solid #3b82f6;" id="cl-preview-text"></div>
            </div>
            <div style="display: flex; gap: 12px;">
              <button onclick="downloadCurrentCoverLetter()" class="btn btn-primary" style="flex: 1;">${t('downloadTXT')}</button>
              <button onclick="navigator.clipboard.writeText(document.getElementById('cl-preview-text').textContent)" class="btn btn-secondary" style="flex: 1;">${t('copyLabel')}</button>
            </div>
          </div>
        </div>
        ` : `<div class="card" style="padding: 32px; text-align: center; color: #999;">${t('pleaseSetupTemplateFirst')}</div>`}
      `;
    }

    function updateCoverLetterPreview() {
      const jobIdx = parseInt(document.getElementById('cl-job-select')?.value || -1);
      if (jobIdx >= 0 && state.jobs[jobIdx]) {
        const preview = generateCoverLetterPreview(jobIdx);
        if (preview) {
          document.getElementById('cl-preview-text').textContent = preview;
          document.getElementById('cl-preview').style.display = 'block';
        }
      } else {
        document.getElementById('cl-preview').style.display = 'none';
      }
    }

    function downloadCurrentCoverLetter() {
      const jobIdx = parseInt(document.getElementById('cl-job-select')?.value || -1);
      if (jobIdx >= 0) {
        downloadCoverLetterAsText(jobIdx);
      }
    }

    function render() {
      syncLangButtons();
      const app = document.getElementById('app');
      if (!currentEmail) {
        app.innerHTML = renderLoginView();
        document.getElementById('sidebar').style.display = 'none';
        document.getElementById('topbar').style.display = 'none';
        document.getElementById('main-content').style.marginLeft = '0';
      } else {
        document.getElementById('sidebar').style.display = 'block';
        document.getElementById('topbar').style.display = 'flex';
        document.getElementById('main-content').style.marginLeft = '';
        document.getElementById('sidebar-subtext').textContent = t('interviewCompanion');
        document.getElementById('sidebar-footer').textContent = t('copyrightNotice');
        renderSidebar();
        let content = '';
        if (currentView === 'dashboard') content = renderDashboard();
        else if (currentView === 'stories') content = renderStories();
        else if (currentView === 'jobTracker') content = renderJobTracker();
        else if (currentView === 'jdAnalyzer') content = renderJDAnalyzer();
        else if (currentView === 'resume') content = renderResume();
        else if (currentView === 'coverLetter') {
          content = renderCoverLetter();
          setTimeout(() => {
            if (state.coverLetterTemplate && document.getElementById('cl-template')) {
              document.getElementById('cl-template').value = state.coverLetterTemplate;
            }
          }, 100);
        }
        app.innerHTML = content;
      }
    }

    applyTheme();
    render();
  </script>
</body>
</html>
